</head><body class="meadow">
<header id="top">
  <div id="hud">
    <div class="title">🌾 OVERGROWTH<small>the solo founder skill tree</small></div>
    <div class="stat meter" title="Runway: how many months of money you have left. Tap the number to change it."><span class="lbl">RUNWAY</span>
      <div class="bar o2"><i id="o2bar"></i></div><input id="runway" type="number" inputmode="numeric" min="0" max="60" aria-label="Runway in months"><span class="lbl">MO</span></div>
    <div class="stat meter" title="Launch readiness: fills up as you clear the 4 launch essentials."><span class="lbl">LAUNCH</span>
      <div class="bar gold"><i id="readybar"></i></div><span id="readypct" class="num">0/4</span></div>
    <div class="stat hide-sm" title="Weekly focus slots: how many chapters you can focus on this week"><span class="lbl">THIS WEEK</span><span id="swings"></span></div>
    <div class="stat hide-sm"><span class="lbl">CLEARED</span><span id="depth" class="num">0/0</span></div>
    <button id="btn-theme" class="px icon" aria-label="Switch theme" title="Switch theme: Meadow / Classic">☀</button>
    <button id="btn-music" class="px icon" aria-label="Toggle music" title="Music">♪</button>
    <button id="btn-sound" class="px icon" aria-label="Toggle sound" title="Sound">🔇</button>
    <button id="btn-menu" class="px icon" aria-label="Menu">☰</button>
  </div>
  <div id="toolbar">
    <input id="search" type="search" placeholder="Search chapters…" aria-label="Search chapters">
    <div id="arcfilters"></div>
    <div class="tools">
      <button id="btn-buffs" class="px">BONUSES</button>
      <button id="btn-week" class="px">THIS WEEK</button>
      <button id="btn-fit" class="px">SHOW ALL</button>
      <button id="btn-help" class="px">HOW TO PLAY</button>
      <button id="btn-reset" class="px danger">START OVER</button>
    </div>
  </div>
</header>
<main id="viewport">
  <div class="skystrip"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div><div class="grassstrip"></div>
  <div id="world"><svg id="vines"></svg><div id="nodes"></div></div>
  <div id="coinpill"><span class="pc"></span><span id="gold">0</span></div>
  <button id="next" class="px nextbtn"></button>
  <div id="legend">
    <span><b class="lg ok"></b>can unlock</span><span><b class="lg no"></b>locked</span><span><b class="lg done"></b>cleared</span>
    <span><i class="vl hard"></i>thorny vine = required</span><span><i class="vl any"></i>yellow vine = any one is enough</span>
  </div>
  <div id="tip" class="hidden"></div>
</main>
<aside id="panel" class="sheet hidden" aria-live="polite"><div class="grab"></div><button id="close" class="px closebtn" aria-label="Close">✕</button><div id="panel-body"></div></aside>
<aside id="drawer" class="sheet left hidden"><div class="grab"></div><button id="dclose" class="px closebtn" aria-label="Close">✕</button><div id="drawer-body"></div></aside>
<div id="modal" class="hidden"></div>
<div id="fxlayer"></div>
<div id="toast"></div>
<script src="icons.js?v=4.1"></script>
<script src="skills-data.js?v=4.1"></script>
<script src="layout.js?v=4.1"></script>
<script src="app.js?v=4.1"></script>
</body></html>
